<meta charset="UTF-8">
<script>
    /*
    Problema: Nome completo
    Peça para o usuário informar o seu nome, o nome do meio e o seu último nome. Após, o programa deverá apresentar a seguinte mensagem:
        O seu nome completo é NOME NOME_DO_MEIO ÚLTIMO_NOME.
    */

    //ENTRADA
const primeiroNome = prompt(`Informe seu primeiro nome:`);
const nomeMeio = prompt(`Informe seu nome do meio:`);
const ultimoNome = prompt(`Informe seu ultimo nome:`);

    //PROCESSAMENTO
    
    //SAÍDA
document.write(`Seu nome completo é: ${primeiroNome} ${nomeMeio} ${ultimoNome}`)
</script>
